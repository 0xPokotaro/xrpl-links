name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # CSS/JS の URL にコミットIDを付けて、更新時にブラウザのキャッシュを確実に切り替える
      - name: Stamp asset version
        run: |
          mkdir -p _site
          cp -R index.html assets .nojekyll _site/
          sed -i "s/__VERSION__/${GITHUB_SHA::7}/g" _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
